<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="extrapants pixel hip patch transparent">
  <defs>
    <mask id="plusOneCut">
      <rect width="32" height="32" fill="#fff"/>
      <!-- + -->
      <rect x="18" y="14" width="1" height="5" fill="#000"/>
      <rect x="16" y="16" width="5" height="1" fill="#000"/>
      <!-- 1 -->
      <rect x="23" y="14" width="2" height="1" fill="#000"/>
      <rect x="24" y="14" width="1" height="6" fill="#000"/>
      <rect x="23" y="19" width="3" height="1" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#plusOneCut)">
    <rect x="8" y="3" width="16" height="3" fill="#c4a35a"/>
    <rect x="9" y="4" width="2" height="2" fill="#9a7a38"/>
    <rect x="15" y="4" width="2" height="2" fill="#9a7a38"/>
    <rect x="21" y="4" width="2" height="2" fill="#9a7a38"/>
    <rect x="7" y="6" width="18" height="4" fill="#2c5282"/>
    <rect x="7" y="10" width="18" height="2" fill="#1e3a5f"/>
    <rect x="9" y="7" width="5" height="4" fill="#1e3a5f"/>
    <rect x="10" y="8" width="3" height="1" fill="#c4a35a"/>
    <rect x="15" y="10" width="2" height="3" fill="#152a48"/>
    <rect x="7" y="12" width="8" height="15" fill="#1e3a5f"/>
    <rect x="7" y="12" width="2" height="15" fill="#2c5282"/>
    <rect x="7" y="27" width="8" height="2" fill="#152a48"/>
    <!-- right hip / leg is wider so +1 sits fully in denim -->
    <rect x="17" y="12" width="10" height="15" fill="#1e3a5f"/>
    <rect x="25" y="12" width="2" height="15" fill="#152a48"/>
    <rect x="17" y="27" width="10" height="2" fill="#152a48"/>
  </g>
</svg>
