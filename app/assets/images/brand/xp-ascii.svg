<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" style="image-rendering:pixelated" role="img" aria-label="extrapants XP ascii-safe">
  <!-- 16x16 block grid. Every cell is on or off. Renders as ASCII, favicon, or terminal art. -->
  <rect width="16" height="16" fill="#0f1c2e"/>
  <!-- belt -->
  <rect x="0" y="6" width="16" height="4" fill="#5a3a28"/>
  <!-- buckle -->
  <rect x="3" y="4" width="10" height="8" fill="#c4a35a"/>
  <rect x="4" y="5" width="8" height="6" fill="#152a48"/>
  <!-- X -->
  <rect x="5" y="6" width="1" height="1" fill="#f4efe4"/>
  <rect x="7" y="6" width="1" height="1" fill="#f4efe4"/>
  <rect x="6" y="7" width="1" height="2" fill="#f4efe4"/>
  <rect x="5" y="9" width="1" height="1" fill="#f4efe4"/>
  <rect x="7" y="9" width="1" height="1" fill="#f4efe4"/>
  <!-- P -->
  <rect x="9" y="6" width="1" height="4" fill="#f4efe4"/>
  <rect x="10" y="6" width="2" height="1" fill="#f4efe4"/>
  <rect x="11" y="7" width="1" height="1" fill="#f4efe4"/>
  <rect x="10" y="8" width="2" height="1" fill="#f4efe4"/>
</svg>
